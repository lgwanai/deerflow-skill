# DeerFlow Skill Configuration
# Copy this file to config.yaml and configure your models and tools

config_version: 12

log_level: info

token_usage:
  enabled: false

# ============================================================================
# Models Configuration
# ============================================================================
models:
  # DeepSeek V4 Flash - Anthropic compatible API
  - name: deepseek-v4-flash
    display_name: DeepSeek V4 Flash
    use: langchain_anthropic:ChatAnthropic
    model: deepseek-v4-flash
    api_key: $DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/anthropic

  # OpenAI model example
  - name: gpt-4
    display_name: GPT-4
    use: langchain_openai:ChatOpenAI
    model: gpt-4
    api_key: $OPENAI_API_KEY

  # Anthropic Claude model example
  - name: claude-3-sonnet
    display_name: Claude 3.5 Sonnet
    use: langchain_anthropic:ChatAnthropic
    model: claude-sonnet-4-20250514
    api_key: $ANTHROPIC_API_KEY

  # Ollama local model example
  - name: llama3
    display_name: Llama 3 (Ollama)
    use: langchain_ollama:ChatOllama
    model: llama3
    base_url: http://localhost:11434
    supports_thinking: false
    supports_vision: false

  # StepFun (阶跃星辰) reasoning models
  # StepFun provides OpenAI-compatible API with reasoning models.
  # Use PatchedChatStepFun instead of plain ChatOpenAI.
  # Docs: https://platform.stepfun.com/docs/api-reference/chat-completions
  # - name: step-3.7-flash
  #   display_name: Step 3.7 Flash
  #   use: deerflow.models.patched_stepfun:PatchedChatStepFun
  #   model: step-3.7-flash
  #   api_key: $STEPFUN_API_KEY
  #   base_url: https://api.stepfun.com/v1
  #   supports_thinking: true
  #   supports_vision: true

# ============================================================================
# Tools Configuration
# ============================================================================
tools:
  # Web search tool (uses DuckDuckGo, no API key required)
  - name: web_search
    group: web
    use: deerflow.community.ddg_search.tools:web_search_tool
    max_results: 5
    # backend: auto          # DDGS backend(s): auto, duckduckgo, brave, wikipedia, etc.

  # Web search tool (uses Tavily API, requires TAVILY_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   api_key: $TAVILY_API_KEY

  # Web search tool (uses Brave Search API, requires BRAVE_SEARCH_API_KEY)
  # Brave Search returns results from an independent index.
  # Sign up at https://brave.com/search/api/
  # - name: web_search
  #   group: web
  #   use: deerflow.community.brave.tools:web_search_tool
  #   max_results: 5
  #   api_key: $BRAVE_SEARCH_API_KEY

  # Web search tool (uses SearXNG, self-hosted, no API key required)
  # Deploy your own instance: https://github.com/searxng/searxng
  # - name: web_search
  #   group: web
  #   use: deerflow.community.searxng.tools:web_search_tool
  #   base_url: http://localhost:8088
  #   max_results: 5

  # Web fetch tool (uses Browserless, self-hosted or cloud)
  # Renders pages with headless Chrome, ideal for JS-heavy sites.
  # Deploy your own: https://github.com/browserless/browserless
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.browserless.tools:web_fetch_tool
  #   base_url: http://localhost:3032
  #   timeout_s: 30

  # Web fetch tool (uses Jina AI reader)
  - name: web_fetch
    group: web
    use: deerflow.community.jina_ai.tools:web_fetch_tool
    timeout: 10
    api_key: $JINA_API_KEY

# ============================================================================
# Subagents Configuration
# ============================================================================
subagents:
  max_concurrent: 3   # 最大并行子代理数 (1-10)
  timeout_seconds: 900  # 子代理超时时间 (秒)
  # agents:  # 按代理名独立配置
  #   general-purpose:
  #     timeout_seconds: 600
  #     max_turns: 50
  #     model: inherit  # inherit | 具体模型名

# ============================================================================
# Sandbox Configuration
# ============================================================================
sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider

# ============================================================================
# Environment Variables
# ============================================================================
# Set these environment variables before running the skill:
#
# Required for model access:
#   DEEPSEEK_API_KEY=sk-xxx           # DeepSeek API key
#   OPENAI_API_KEY=sk-xxx              # OpenAI API key
#   ANTHROPIC_API_KEY=sk-ant-xxx       # Anthropic API key
#   STEPFUN_API_KEY=xxx                # StepFun API key (optional)
#
# Required for web tools:
#   JINA_API_KEY=jina_xxx              # Jina AI API key (https://jina.ai/reader)
#
# Optional web tools (one of):
#   TAVILY_API_KEY=tvly-xxx            # Tavily search API key (https://tavily.com)
#   BRAVE_SEARCH_API_KEY=BSAxxx        # Brave Search API key (https://brave.com/search/api/)
#
# Or create a .env file and use python-dotenv
